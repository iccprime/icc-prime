<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICC Prime Live Stream</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    body {
      margin: 0;
      background-color: #0d1117;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      background: #161b22;
      padding: 12px 0;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      border-bottom: 1px solid #30363d;
    }
    .player-container {
      width: 100%;
      max-width: 900px;
      margin-top: 15px;
      background: #000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .tg-btn {
      margin-top: 20px;
      background: #0088cc;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    .tg-btn:hover {
      opacity: 0.9;
    }
    .status-msg {
      margin-top: 12px;
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">🏏 ICC Prime Live</div>

  <div class="player-container">
    <video id="player" playsinline controls autoplay></video>
  </div>

  <div id="status" class="status-msg"></div>

  <a class="tg-btn" href="https://t.me/iccprime" target="_blank">
    📢 Join Telegram @iccprime
  </a>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    // 1. Add your stream IDs and .m3u8 URLs here
    const streams = {
      "hindi": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
      "english": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
      "tamil": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
      "telugu": "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
    };

    // 2. Read the ?id= parameter from the link
    const params = new URLSearchParams(window.location.search);
    const streamId = params.get("id") || "english";
    const streamUrl = streams[streamId];
    const video = document.getElementById("player");
    const statusText = document.getElementById("status");

    if (!streamUrl) {
      statusText.innerText = "Stream ID not found. Please check your link.";
    } else {
      statusText.innerText = "Playing feed: " + streamId.toUpperCase();

      // Works on Android/PC (via HLS.js) with quality selector
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
          const availableQualities = hls.levels.map((l) => l.height);
          new Plyr(video, {
            quality: {
              default: availableQualities[0],
              options: availableQualities,
              forced: true,
              onChange: (newQuality) => {
                hls.levels.forEach((level, levelIndex) => {
                  if (level.height === newQuality) {
                    hls.currentLevel = levelIndex;
                  }
                });
              }
            }
          });
        });
      }
      // Works automatically on iPhone / iPad (Safari native HLS)
      else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = streamUrl;
        new Plyr(video);
      }
    }
  </script>
</body>
</html>
